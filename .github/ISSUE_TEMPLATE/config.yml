# yaml-language-server: $schema=https://json.schemastore.org/github-issue-config.json
blank_issues_enabled: false
contact_links:
  - name: Confirmed general Zed editor issue
    url: https://github.com/zed-industries/zed/issues/new/choose
    about: Report editor, UI, theme, bundled C++, or LSP-client problems confirmed not to be specific to this extension.
  - name: Confirmed LLVM or MLIR language-server issue
    url: https://github.com/llvm/llvm-project/issues/new/choose
    about: Report server behavior confirmed to reproduce outside Zed with an LLVM language-server binary.
