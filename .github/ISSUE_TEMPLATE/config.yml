# yaml-language-server: $schema=https://json.schemastore.org/github-issue-config.json
blank_issues_enabled: false
contact_links:
  - name: Zed editor issue
    url: https://github.com/zed-industries/zed/issues/new/choose
    about: Editor, UI, theme, or LSP-client problems that also happen with this extension disabled.
  - name: LLVM language-server issue
    url: https://github.com/llvm/llvm-project/issues/new/choose
    about: mlir-lsp-server, mlir-pdll-lsp-server, or tblgen-lsp-server behavior that also happens outside Zed.
