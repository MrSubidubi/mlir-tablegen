# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest an improvement to MLIR, TableGen, or PDLL support
labels:
  - Enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you are after. You do not need to work out whether it belongs in this extension, a Tree-sitter parser ([mlir](https://github.com/felixtensor/tree-sitter-mlir), [tablegen](https://github.com/felixtensor/tree-sitter-tablegen), [pdll](https://github.com/felixtensor/tree-sitter-pdll)), Zed, or LLVM.

        Please remove secrets, private paths, and proprietary source from anything you paste.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this request.
          required: true

  - type: dropdown
    id: languages
    attributes:
      label: Language
      description: Pick every language involved.
      multiple: true
      options:
        - MLIR
        - TableGen
        - PDLL
        - C++ host or injected content
        - Not language-specific
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: A rough guess is fine — this only helps with labeling.
      multiple: true
      options:
        - Tree-sitter parsing
        - Syntax highlighting
        - Language injection (MLIR in C++, C++ in PDLL or TableGen)
        - Indentation, brackets, or comments
        - Symbol outline
        - Language-server discovery or configuration
        - Language-server features or completion styling
        - Installation, build, or packaging
        - Documentation, tests, or CI
        - Other or unsure

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what slows you down today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead? An example of the syntax, outline, or setting you have in mind is worth a lot here.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Alternatives and context
      description: Current workarounds, screenshots, upstream links, or anything else that helps.
