# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Question
description: Ask about setup, configuration, or how something works
labels:
  - Question
body:
  - type: markdown
    attributes:
      value: |
        For anything that is not yet a reproducible bug or a scoped request. The README covers language-server setup, Zed configuration, and SSH remote development.

        Please remove secrets, private paths, and proprietary source from anything you paste.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I checked the README and the existing issues.
          required: true

  - type: dropdown
    id: languages
    attributes:
      label: Language
      description: Pick every language involved.
      multiple: true
      options:
        - MLIR
        - TableGen
        - PDLL
        - C++ host or injected content
        - Not language-specific
        - Unsure
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and which part is unclear?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you have tried, the relevant settings or commands and their output, and your Zed, extension, LLVM, and OS versions if they matter.
