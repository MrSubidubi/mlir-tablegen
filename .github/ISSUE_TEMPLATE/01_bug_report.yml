# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Bug report
description: Something is broken in MLIR, TableGen, or PDLL support
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: |
        File it here even if you are not sure whether the cause is this extension, a Tree-sitter parser ([mlir](https://github.com/felixtensor/tree-sitter-mlir), [tablegen](https://github.com/felixtensor/tree-sitter-tablegen), [pdll](https://github.com/felixtensor/tree-sitter-pdll)), Zed, or an LLVM language server. Working that out is triage, and triage is our job.

        Please remove secrets, private paths, and proprietary source from anything you paste.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true

  - type: dropdown
    id: languages
    attributes:
      label: Language
      description: Pick every language involved.
      multiple: true
      options:
        - MLIR
        - TableGen
        - PDLL
        - C++ host or injected content
        - Not language-specific
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: A rough guess is fine — this only helps with labeling.
      multiple: true
      options:
        - Syntax highlighting
        - Injected-language highlighting
        - Indentation, brackets, or comments
        - Symbol outline
        - Language-server discovery or configuration
        - Language-server features (diagnostics, navigation, hover, completion)
        - Installation, build, or packaging
        - Documentation or repository metadata
        - Other or unsure

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: How to reproduce it, what you saw, and what you expected instead.
      placeholder: |
        1. Open a .mlir file containing ...
        2. ...

        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The smallest source, settings, or command that shows the problem. For a highlighting or parsing report, a syntax-tree fragment showing any `ERROR` or `MISSING` nodes helps. Screenshots and attachments are welcome.

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "In Zed, run `zed: copy system specs into clipboard`. For a dev extension, give the commit instead of a version. Enter `N/A` for documentation-only reports."
      placeholder: |
        Zed: ...
        Extension version or commit: ...
        OS and architecture: ...
        Workspace: local / SSH remote
    validations:
      required: true

  - type: textarea
    id: lsp
    attributes:
      label: Language server, settings, and logs
      description: Only for language-server problems. Paste the relevant Zed settings and log lines.
      placeholder: |
        Server: mlir-lsp-server / mlir-pdll-lsp-server / tblgen-lsp-server
        LLVM version or commit: ...
        Resolved from: binary.path / settings.path / $PATH
        Compilation database and extra_dirs: ...
        Also happens outside Zed: yes / no / not tested
